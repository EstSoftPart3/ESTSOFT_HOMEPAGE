<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 대화 사전</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행회화">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
	:root {
		--bg: #f4f6f9; --card: #ffffff; --text: #111111; --muted: #6b7280; --line: rgba(17,17,17,.08);
		--accent: #16D5FF; --chip: #ffffff; --chip-active: #111111; --chip-active-text: #ffffff;
		--overlay: #ffffff;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0f1115; --card: #181b21; --text: #f3f4f6; --muted: #9ca3af; --line: rgba(255,255,255,.08);
			--chip: #181b21; --chip-active: #f3f4f6; --chip-active-text: #111111; --overlay: #0f1115;
		}
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
	body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
	button, select { font: inherit; color: inherit; }

	header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
	h1 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
	/* minmax(0,1fr): select 의 내용 폭 때문에 좁은 화면에서 넘치지 않게 */
	.langs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }
	.langs label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
	.langs select { width: 100%; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 15px; }
	.swap { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; }
	.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
	.chips::-webkit-scrollbar { display: none; }
	.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
	.chip[aria-pressed="true"] { background: var(--chip-active); color: var(--chip-active-text); border-color: var(--chip-active); }

	main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
	.hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
	.phrase { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
	.phrase:active { transform: scale(.99); }
	.phrase .mine { font-size: 14px; color: var(--muted); }
	.phrase .theirs { font-size: 21px; font-weight: 700; margin-top: 4px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
	.phrase:focus-visible, .chip:focus-visible, .swap:focus-visible, .ov button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

	.ov { position: fixed; inset: 0; z-index: 10; background: var(--overlay); display: none; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
	.ov.open { display: flex; }
	.ov .please { font-size: 15px; color: var(--muted); }
	.ov .big { flex: 1; display: flex; align-items: center; font-size: clamp(30px, 9vw, 64px); font-weight: 800; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
	.ov .small { font-size: 17px; color: var(--muted); margin-bottom: 18px; }
	.ov .row { display: flex; gap: 10px; }
	.ov .row button { flex: 1; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 17px; font-weight: 700; cursor: pointer; }
	.ov .row .primary { background: var(--chip-active); color: var(--chip-active-text); border-color: var(--chip-active); }
</style>
</head>
<body>

<header>
	<h1><span aria-hidden="true">💬</span><span id="title"></span></h1>
	<div class="langs">
		<div><label for="myLang" id="lblMe"></label><select id="myLang"></select></div>
		<button type="button" class="swap" id="swap" aria-label="⇄">⇄</button>
		<div><label for="theirLang" id="lblThem"></label><select id="theirLang"></select></div>
	</div>
	<nav class="chips" id="chips"></nav>
</header>

<main>
	<p class="hint" id="hint"></p>
	<div id="list"></div>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovBig">
	<div class="please" id="ovPlease"></div>
	<div class="big" id="ovBig"></div>
	<div class="small" id="ovSmall"></div>
	<div class="row">
		<button type="button" id="ovSpeak"></button>
		<button type="button" class="primary" id="ovClose"></button>
	</div>
</div>

var $ = function(id) { return document.getElementById(id); };
var state = { me: 'ko', them: 'vi', sit: 0 };
var openPhrase = null;

function idx(lang) { return LANGS.indexOf(lang); }
function t(key) { return UI[key][idx(state.me)]; }

// 저장된 선택은 편의 기능일 뿐이라 실패해도 기본값으로 동작한다
function load() {
	try { var s = JSON.parse(localStorage.getItem('phrasebook') || 'null'); if (s && idx(s.me) >= 0 && idx(s.them) >= 0) state = s; } catch (e) {}
	if (!(state.sit >= 0 && state.sit < SITUATIONS.length)) state.sit = 0;
}
function save() { try { localStorage.setItem('phrasebook', JSON.stringify(state)); } catch (e) {} }

function fillSelect(sel, value) {
	sel.innerHTML = '';
	LANGS.forEach(function(l, i) {
		var o = document.createElement('option');
		o.value = l;
		o.textContent = FLAG[l] + ' ' + NAME[state.me][i];
		sel.appendChild(o);
	});
	sel.value = value;
}

function render() {
	document.documentElement.lang = state.me;
	document.title = t('title');
	$('title').textContent = t('title');
	$('lblMe').textContent = t('me');
	$('lblThem').textContent = t('them');
	$('hint').textContent = t('hint');
	fillSelect($('myLang'), state.me);
	fillSelect($('theirLang'), state.them);

	var chips = $('chips');
	chips.innerHTML = '';
	SITUATIONS.forEach(function(s, i) {
		var b = document.createElement('button');
		b.type = 'button';
		b.className = 'chip';
		b.textContent = s.name[idx(state.me)];
		b.setAttribute('aria-pressed', i === state.sit);
		b.onclick = function() { state.sit = i; save(); render(); window.scrollTo(0, 0); };
		chips.appendChild(b);
	});

	var list = $('list');
	list.innerHTML = '';
	SITUATIONS[state.sit].phrases.forEach(function(p) {
		var b = document.createElement('button');
		b.type = 'button';
		b.className = 'phrase';
		b.lang = state.them;
		var mine = document.createElement('div');
		mine.className = 'mine';
		mine.lang = state.me;
		mine.textContent = p[idx(state.me)];
		var theirs = document.createElement('div');
		theirs.className = 'theirs';
		theirs.textContent = p[idx(state.them)];
		b.appendChild(mine);
		b.appendChild(theirs);
		b.onclick = function() { show(p); };
		list.appendChild(b);
	});

	var active = chips.querySelector('[aria-pressed="true"]');
	if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function show(p) {
	openPhrase = p;
	$('ovPlease').textContent = UI.please[idx(state.them)];
	$('ovPlease').lang = state.them;
	$('ovBig').textContent = p[idx(state.them)];
	$('ovBig').lang = state.them;
	$('ovSmall').textContent = p[idx(state.me)];
	$('ovSpeak').textContent = t('listen');
	$('ovClose').textContent = t('close');
	$('ov').classList.add('open');
	$('ovClose').focus();
}

function hide() {
	$('ov').classList.remove('open');
	openPhrase = null;
	if (window.speechSynthesis) speechSynthesis.cancel();
}

function speak() {
	if (!openPhrase) return;
	var code = VOICE[state.them];
	var voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
	var voice = voices.filter(function(v) { return v.lang.replace('_', '-').toLowerCase().indexOf(code.slice(0, 2).toLowerCase()) === 0; })[0];
	if (!voice) { alert(t('noVoice')); return; }
	speechSynthesis.cancel();
	var u = new SpeechSynthesisUtterance(openPhrase[idx(state.them)]);
	u.lang = code;
	u.voice = voice;
	u.rate = 0.9;
	speechSynthesis.speak(u);
}

$('myLang').onchange = function() {
	state.me = this.value;
	if (state.them === state.me) state.them = LANGS[(idx(state.me) + 1) % LANGS.length];
	save(); render();
};
$('theirLang').onchange = function() {
	state.them = this.value;
	if (state.them === state.me) state.me = LANGS[(idx(state.them) + 1) % LANGS.length];
	save(); render();
};
$('swap').onclick = function() { var m = state.me; state.me = state.them; state.them = m; save(); render(); };
$('ovClose').onclick = hide;
$('ovSpeak').onclick = speak;
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hide(); });
// 일부 브라우저는 음성 목록을 늦게 채운다
if (window.speechSynthesis) speechSynthesis.getVoices();

load();
render();

if ('serviceWorker' in navigator) {
	navigator.serviceWorker.register('sw.js').catch(function() {});
}
</script>
