<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 대화 사전</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행회화">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
	:root {
		--bg: #f4f6f9; --card: #ffffff; --text: #111111; --muted: #6b7280; --line: rgba(17,17,17,.08);
		--accent: #16D5FF; --pron: #0e7490; --chip-active: #111111; --chip-active-text: #ffffff; --danger: #dc2626;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0f1115; --card: #181b21; --text: #f3f4f6; --muted: #9ca3af; --line: rgba(255,255,255,.08);
			--pron: #67e8f9; --chip-active: #f3f4f6; --chip-active-text: #111111; --danger: #f87171;
		}
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
	body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
	button, select, input { font: inherit; color: inherit; }
	button { cursor: pointer; }
	:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

	header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
	h1 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
	/* minmax(0,1fr): select 의 내용 폭 때문에 좁은 화면에서 넘치지 않게 */
	.langs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }
	.langs label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
	.langs select { width: 100%; padding: 10px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 15px; }
	.swap { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; }
	.search { position: relative; margin-top: 10px; }
	.search input { width: 100%; padding: 11px 14px 11px 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
	.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
	.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
	.chips::-webkit-scrollbar { display: none; }
	.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; }
	.chip[aria-pressed="true"] { background: var(--chip-active); color: var(--chip-active-text); border-color: var(--chip-active); }

	main { padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px; margin-bottom: 10px; }
	.card .sit { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
	.card .mine { font-size: 14px; color: var(--muted); }
	.card .theirs { font-size: 22px; font-weight: 700; margin-top: 3px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
	.card .pron { font-size: 14px; color: var(--pron); margin-top: 3px; word-break: keep-all; overflow-wrap: anywhere; }
	.card .badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--line); color: var(--muted); vertical-align: 1px; }
	.slot { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: .12em; text-underline-offset: .18em; }
	.tools { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
	.tools .ctl { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
	.tools .ctl button { width: 36px; height: 36px; flex: none; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 18px; font-weight: 700; }
	.tools .ctl input, .tools .ctl select { min-width: 0; height: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 15px; font-weight: 600; }
	.tools .ctl input { width: 100px; text-align: center; }
	.tools .ctl select { flex: 1; max-width: 220px; }
	.tools .spacer { flex: 1; }
	.icon { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 13px; }
	.icon.del { color: var(--danger); }

	.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
	.addbox { background: var(--card); border: 1px dashed var(--accent); border-radius: 14px; padding: 16px; text-align: center; }
	.addbox button { padding: 12px 18px; border-radius: 12px; border: 0; background: var(--chip-active); color: var(--chip-active-text); font-size: 15px; font-weight: 700; }
	.addbox button:disabled { opacity: .6; }
	.addbox p { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
	details.hidden { margin-top: 18px; color: var(--muted); font-size: 14px; }
	details.hidden summary { cursor: pointer; padding: 6px 0; }
	details.hidden .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
	details.hidden .row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>

<header>
	<h1><span aria-hidden="true">💬</span><span id="title"></span></h1>
	<div class="langs">
		<div><label for="myLang" id="lblMe"></label><select id="myLang"></select></div>
		<button type="button" class="swap" id="swap" aria-label="⇄">⇄</button>
		<div><label for="theirLang" id="lblThem"></label><select id="theirLang"></select></div>
	</div>
	<div class="search">
		<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
		<input type="search" id="q" autocomplete="off" enterkeyhint="search">
	</div>
	<nav class="chips" id="chips"></nav>
</header>

<main>
	<div id="list"></div>
	<details class="hidden" id="hiddenBox" hidden>
		<summary id="hiddenTitle"></summary>
		<div id="hiddenList"></div>
	</details>
</main>

<!-- ?v= 는 Cloudflare 가 .js 를 4시간 캐시해서 붙인다. 파일을 바꾸면 여기와 sw.js 의 VERSION 을 같이 올린다 -->
<script src="data.js?v=5"></script>
<script src="pron.js?v=5"></script>
<script src="pron_ko.js?v=5"></script>
<script src="pron_en.js?v=5"></script>
<script src="pron_vi.js?v=5"></script>
<script src="pron_ja.js?v=5"></script>
<script src="pron_zh.js?v=5"></script>
<script src="pron_th.js?v=5"></script>
<script>
var $ = function(id) { return document.getElementById(id); };
var ICON_SPEAK = '<svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var ICON_DEL = '<svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 12H7L6 9z"/></svg>';
var MT_LANG = { ko: 'ko', en: 'en', vi: 'vi', ja: 'ja', zh: 'zh-CN', th: 'th' };

var state = { me: 'ko', them: 'vi', sit: 0, vals: {} };
var shared = { added: [], hidden: [] }; // 서버의 공유 상태(추가한 문장, 숨긴 키)
var query = '';

function idx(lang) { return LANGS.indexOf(lang); }
function t(key) { return UI[key][idx(state.me)]; }

// 저장된 선택은 편의 기능일 뿐이라 실패해도 기본값으로 동작한다
function load() {
	try { var s = JSON.parse(localStorage.getItem('phrasebook') || 'null'); if (s && idx(s.me) >= 0 && idx(s.them) >= 0) state = s; } catch (e) {}
	if (!(state.sit >= 0 && state.sit < SITUATIONS.length)) state.sit = 0;
	if (!state.vals || typeof state.vals !== 'object') state.vals = {};
	try { var c = JSON.parse(localStorage.getItem('phrasebook-shared') || 'null'); if (c && c.added && c.hidden) shared = c; } catch (e) {}
}
function save() { try { localStorage.setItem('phrasebook', JSON.stringify(state)); } catch (e) {} }

// 문장 항목은 배열(고정 문장) 또는 { t: 언어별 틀, n: 숫자 칸 {v,min,max} 또는 w: 단어 목록(단어마다 언어별 표기) }
function tpl(p) { return Array.isArray(p) ? p : p.t; }

function slotVal(p, k) {
	var v = state.vals[k];
	if (p.n) return (typeof v === 'number' && v >= p.n.min && v <= p.n.max) ? v : p.n.v;
	if (p.w) return (v >= 0 && v < p.w.length) ? v : 0;
	return null;
}

// 틀 s 를 [{text, slot}] 조각으로. {a|b} 는 숫자가 1이면 a, 아니면 b (영어 단·복수), {n}/{w} 는 fill
function split(s, p, v, fill) {
	if (p.n) s = s.replace(/\{([^{}|]*)\|([^{}]*)\}/g, function(_, one, many) { return v === 1 ? one : many; });
	return s.split(/(\{[nw]\})/).filter(Boolean).map(function(x) {
		return /^\{[nw]\}$/.test(x) ? { text: fill, slot: true } : { text: x };
	});
}
function parts(p, li, v) {
	return split(tpl(p)[li], p, v, p.n ? v.toLocaleString('en-US') : p.w ? p.w[v][li] : '');
}
function text(p, li, v) { return parts(p, li, v).map(function(x) { return x.text; }).join(''); }

// 상대 언어 문장을 내 언어 글자로 적은 발음 (pron.js). 없으면 null
function pronParts(e, v) {
	if (e.added || typeof PRON === 'undefined') return null;
	var ko = tpl(e.p)[0];
	var s = PRON[ko] && PRON[ko][state.them] && PRON[ko][state.them][state.me];
	if (!s) return null;
	var fill = '';
	if (e.p.n) fill = v.toLocaleString('en-US');
	if (e.p.w) {
		var w = PRON_W[ko] && PRON_W[ko][v] && PRON_W[ko][v][state.them] && PRON_W[ko][v][state.them][state.me];
		if (!w) return null;
		fill = w;
	}
	return split(s, e.p, v, fill);
}

// 바뀌는 칸은 밑줄로 표시해서 상대도 어디가 바뀐 말인지 알 수 있게 한다
function paint(el, list) {
	el.textContent = '';
	list.forEach(function(x) {
		if (!x.slot) { el.appendChild(document.createTextNode(x.text)); return; }
		var s = document.createElement('span');
		s.className = 'slot';
		s.textContent = x.text;
		el.appendChild(s);
	});
}

// 화면에 올릴 문장 목록: 기본 문장 + 추가한 문장, 숨긴 것 제외
function entries(sitIdx) {
	var out = [];
	SITUATIONS[sitIdx].phrases.forEach(function(p) { out.push({ p: p, k: 'b:' + tpl(p)[0], sit: sitIdx }); });
	shared.added.forEach(function(a) {
		if (a.SIT_IDX !== sitIdx) return;
		out.push({ p: LANGS.map(function(l) { return a['TXT_' + l.toUpperCase()]; }), k: 'a:' + a.PHRASE_SQ, sit: sitIdx, added: true });
	});
	return out;
}
function isHidden(k) { return shared.hidden.indexOf(k) >= 0; }

function norm(s) { return String(s).toLowerCase().replace(/\s+/g, ''); }
function matches(e, q) {
	var v = slotVal(e.p, e.k);
	var hay = [text(e.p, idx(state.me), v), text(e.p, idx(state.them), v)];
	if (e.p.w) e.p.w.forEach(function(w) { hay.push(w[idx(state.me)], w[idx(state.them)]); });
	return hay.some(function(h) { return norm(h).indexOf(q) >= 0; });
}

function fillSelect(sel, value) {
	sel.innerHTML = '';
	LANGS.forEach(function(l, i) {
		var o = document.createElement('option');
		o.value = l;
		o.textContent = FLAG[l] + ' ' + NAME[state.me][i];
		sel.appendChild(o);
	});
	sel.value = value;
}

function render() {
	document.documentElement.lang = state.me;
	document.title = t('title');
	$('title').textContent = t('title');
	$('lblMe').textContent = t('me');
	$('lblThem').textContent = t('them');
	$('q').placeholder = t('search');
	$('q').setAttribute('aria-label', t('search'));
	fillSelect($('myLang'), state.me);
	fillSelect($('theirLang'), state.them);

	var chips = $('chips');
	chips.innerHTML = '';
	SITUATIONS.forEach(function(s, i) {
		var b = document.createElement('button');
		b.type = 'button';
		b.className = 'chip';
		b.textContent = s.name[idx(state.me)];
		b.setAttribute('aria-pressed', !query && i === state.sit);
		b.onclick = function() { state.sit = i; query = ''; $('q').value = ''; save(); render(); window.scrollTo(0, 0); };
		chips.appendChild(b);
	});
	var active = chips.querySelector('[aria-pressed="true"]');
	if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });

	renderList();
	renderHidden();
}

function renderList() {
	var list = $('list');
	list.innerHTML = '';
	var shown;
	if (query) {
		var q = norm(query);
		shown = [];
		SITUATIONS.forEach(function(s, i) {
			// 상황 이름이 맞으면(예: '택시') 그 상황의 문장을 모두 보여준다
			var all = norm(s.name[idx(state.me)]).indexOf(q) >= 0;
			entries(i).forEach(function(e) { if (!isHidden(e.k) && (all || matches(e, q))) shown.push(e); });
		});
	} else {
		shown = entries(state.sit).filter(function(e) { return !isHidden(e.k); });
	}
	shown.forEach(function(e) { list.appendChild(card(e)); });
	if (query && !shown.length) list.appendChild(addBox());
}

function card(e) {
	var p = e.p, v = slotVal(p, e.k);
	var div = document.createElement('div');
	div.className = 'card';
	if (query) {
		var sit = document.createElement('div');
		sit.className = 'sit';
		sit.textContent = SITUATIONS[e.sit].name[idx(state.me)];
		div.appendChild(sit);
	}
	var mine = document.createElement('div');
	mine.className = 'mine';
	mine.lang = state.me;
	paint(mine, parts(p, idx(state.me), v));
	if (e.added) {
		var badge = document.createElement('span');
		badge.className = 'badge';
		badge.textContent = t('added');
		mine.appendChild(badge);
	}
	var theirs = document.createElement('div');
	theirs.className = 'theirs';
	theirs.lang = state.them;
	paint(theirs, parts(p, idx(state.them), v));
	div.appendChild(mine);
	div.appendChild(theirs);

	var pp = pronParts(e, v);
	if (pp) {
		var pron = document.createElement('div');
		pron.className = 'pron';
		pron.lang = state.me;
		paint(pron, pp);
		div.appendChild(pron);
	}

	var tools = document.createElement('div');
	tools.className = 'tools';
	var ctl = slotControl(e, v, function() {
		var nv = slotVal(p, e.k);
		paint(mine, parts(p, idx(state.me), nv));
		if (e.added) mine.appendChild(badge);
		paint(theirs, parts(p, idx(state.them), nv));
		var np = pronParts(e, nv);
		if (np && pron) paint(pron, np);
	});
	tools.appendChild(ctl || Object.assign(document.createElement('span'), { className: 'spacer' }));

	var speak = document.createElement('button');
	speak.type = 'button';
	speak.className = 'icon';
	speak.innerHTML = ICON_SPEAK;
	speak.appendChild(document.createTextNode(t('listen')));
	speak.onclick = function() { say(text(p, idx(state.them), slotVal(p, e.k))); };
	var del = document.createElement('button');
	del.type = 'button';
	del.className = 'icon del';
	del.innerHTML = ICON_DEL;
	del.setAttribute('aria-label', t('del'));
	del.title = t('del');
	del.onclick = function() { if (confirm(t('confirmDel'))) setHidden(e.k, true); };
	tools.appendChild(speak);
	tools.appendChild(del);
	div.appendChild(tools);
	return div;
}

// 숫자 칸은 −/+ 와 직접 입력, 단어 칸은 내 언어로 된 목록에서 고른다. 고르면 바로 문장이 바뀐다
function slotControl(e, v, repaint) {
	var p = e.p;
	if (!p.n && !p.w) return null;
	var box = document.createElement('div');
	box.className = 'ctl';
	var set = function(x) { state.vals[e.k] = x; save(); repaint(); };
	if (p.n) {
		var input = document.createElement('input');
		input.type = 'number';
		input.inputMode = 'numeric';
		input.min = p.n.min;
		input.max = p.n.max;
		input.value = v;
		input.setAttribute('aria-label', '#');
		var clamp = function(x) { return Math.min(p.n.max, Math.max(p.n.min, x)); };
		var step = function(d) { var x = clamp(slotVal(p, e.k) + d); input.value = x; set(x); };
		var minus = document.createElement('button');
		minus.type = 'button';
		minus.textContent = '−';
		minus.setAttribute('aria-label', '-1');
		minus.onclick = function() { step(-1); };
		var plus = document.createElement('button');
		plus.type = 'button';
		plus.textContent = '+';
		plus.setAttribute('aria-label', '+1');
		plus.onclick = function() { step(1); };
		// 입력 중에는 범위 안의 숫자일 때만 반영하고, 입력을 마치면 범위로 맞춘다
		input.oninput = function() { var x = parseInt(input.value, 10); if (x >= p.n.min && x <= p.n.max) set(x); };
		input.onchange = function() { var x = parseInt(input.value, 10); x = isNaN(x) ? slotVal(p, e.k) : clamp(x); input.value = x; set(x); };
		box.appendChild(minus);
		box.appendChild(input);
		box.appendChild(plus);
	} else {
		var sel = document.createElement('select');
		sel.setAttribute('aria-label', text(p, idx(state.me), v));
		p.w.forEach(function(word, i) {
			var o = document.createElement('option');
			o.value = i;
			o.textContent = word[idx(state.me)];
			sel.appendChild(o);
		});
		sel.value = v;
		sel.onchange = function() { set(Number(sel.value)); };
		box.appendChild(sel);
	}
	return box;
}

function addBox() {
	var box = document.createElement('div');
	box.className = 'addbox';
	var msg = document.createElement('div');
	msg.className = 'empty';
	msg.textContent = t('noHit');
	var btn = document.createElement('button');
	btn.type = 'button';
	btn.textContent = t('addTr');
	btn.onclick = function() { translateAndAdd(query.trim(), btn); };
	var note = document.createElement('p');
	note.textContent = t('trNote');
	box.appendChild(msg);
	box.appendChild(btn);
	box.appendChild(note);
	return box;
}

function decodeEntities(s) {
	var ta = document.createElement('textarea');
	ta.innerHTML = s;
	return ta.value;
}

// MyMemory 무료 번역. 내 언어 → 나머지 5개 언어로 번역해 공유 목록에 추가한다
function translateAndAdd(src, btn) {
	if (!src) return;
	src = src.slice(0, 300);
	btn.disabled = true;
	btn.textContent = t('adding');
	var me = state.me;
	var texts = {};
	texts[me] = src;
	var jobs = LANGS.filter(function(l) { return l !== me; }).map(function(l) {
		var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(src) + '&langpair=' + MT_LANG[me] + '|' + MT_LANG[l];
		return fetch(url).then(function(r) { return r.json(); }).then(function(j) {
			var out = j && j.responseStatus == 200 && j.responseData && j.responseData.translatedText;
			if (!out) throw new Error('mt');
			texts[l] = decodeEntities(out).slice(0, 300);
		});
	});
	Promise.all(jobs).then(function() {
		var body = new URLSearchParams({ sit: String(state.sit), src: me });
		LANGS.forEach(function(l) { body.append(l, texts[l]); });
		return post('addData.do', body).then(function(res) {
			shared.added.push(res.phrase);
			saveShared();
			renderList();
		});
	}).catch(function(err) {
		alert(err && err.message === 'rate' ? t('rate') : err && err.message === 'net' ? t('failNet') : t('failTr'));
		btn.disabled = false;
		btn.textContent = t('addTr');
	});
}

function post(path, body) {
	return fetch(path, { method: 'POST', body: body }).catch(function() { throw new Error('net'); }).then(function(r) {
		if (!r.ok) throw new Error('net');
		return r.json();
	}).then(function(j) {
		if (j.error) throw new Error(j.error === 'rate' ? 'rate' : 'net');
		return j;
	});
}

function saveShared() { try { localStorage.setItem('phrasebook-shared', JSON.stringify(shared)); } catch (e) {} }

function setHidden(k, hide) {
	post(hide ? 'hideData.do' : 'unhideData.do', new URLSearchParams({ key: k })).then(function() {
		shared.hidden = shared.hidden.filter(function(x) { return x !== k; });
		if (hide) shared.hidden.push(k);
		saveShared();
		renderList();
		renderHidden();
	}).catch(function(err) { alert(err.message === 'rate' ? t('rate') : t('failNet')); });
}

// 숨긴 문장(모든 상황) 되돌리기
function renderHidden() {
	var rows = [];
	SITUATIONS.forEach(function(s, i) { entries(i).forEach(function(e) { if (isHidden(e.k)) rows.push(e); }); });
	$('hiddenBox').hidden = !rows.length;
	$('hiddenTitle').textContent = t('hiddenN') + ' (' + rows.length + ')';
	var list = $('hiddenList');
	list.innerHTML = '';
	rows.forEach(function(e) {
		var row = document.createElement('div');
		row.className = 'row';
		var label = document.createElement('span');
		label.textContent = text(e.p, idx(state.me), slotVal(e.p, e.k));
		var btn = document.createElement('button');
		btn.type = 'button';
		btn.className = 'icon';
		btn.textContent = t('restore');
		btn.onclick = function() { setHidden(e.k, false); };
		row.appendChild(label);
		row.appendChild(btn);
		list.appendChild(row);
	});
}

function say(s) {
	var code = VOICE[state.them];
	var voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
	var voice = voices.filter(function(v) { return v.lang.replace('_', '-').toLowerCase().indexOf(code.slice(0, 2).toLowerCase()) === 0; })[0];
	if (!voice) { alert(t('noVoice')); return; }
	speechSynthesis.cancel();
	var u = new SpeechSynthesisUtterance(s);
	u.lang = code;
	u.voice = voice;
	u.rate = 0.9;
	speechSynthesis.speak(u);
}

$('myLang').onchange = function() {
	state.me = this.value;
	if (state.them === state.me) state.them = LANGS[(idx(state.me) + 1) % LANGS.length];
	save(); render();
};
$('theirLang').onchange = function() {
	state.them = this.value;
	if (state.them === state.me) state.me = LANGS[(idx(state.them) + 1) % LANGS.length];
	save(); render();
};
$('swap').onclick = function() { var m = state.me; state.me = state.them; state.them = m; save(); render(); };
$('q').oninput = function() {
	query = this.value;
	var on = !!query.trim();
	Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c, i) { c.setAttribute('aria-pressed', !on && i === state.sit); });
	renderList();
};
// 일부 브라우저는 음성 목록을 늦게 채운다
if (window.speechSynthesis) speechSynthesis.getVoices();

load();
render();

// 공유 상태는 마지막으로 받은 것을 먼저 보여주고, 서버에서 새로 받으면 다시 그린다
fetch('stateData.do', { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(j) {
	if (!j.added || !j.hidden) return;
	shared = { added: j.added, hidden: j.hidden };
	saveShared();
	renderList();
	renderHidden();
}).catch(function() {});

if ('serviceWorker' in navigator) {
	navigator.serviceWorker.register('sw.js?v=5').catch(function() {});
}
</script>
</body>
</html>
